<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img"
     aria-label="Sequential autoregressive sampling versus parallel sampling">
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748C"/>
    </marker>
  </defs>
  <rect width="1200" height="470" fill="#FFFFFF"/>

  <text x="40" y="50" font-family="Aptos Display, Segoe UI, Noto Sans SC, sans-serif" font-size="22"
        font-weight="650" fill="#111A28">同一件事，两种做法：串行逐词 vs 一次并行</text>
  <text x="40" y="78" font-family="Aptos, Segoe UI, Noto Sans SC, sans-serif" font-size="14" fill="#64748C">
    速度与成本差异的根源不在「模型更聪明」，而在采样方式
  </text>

  <!-- 左：串行 -->
  <rect x="40" y="112" width="536" height="252" rx="14" fill="#FFFFFF" stroke="#E4E8EE"/>
  <text x="62" y="146" font-family="Aptos Display, Segoe UI, Noto Sans SC, sans-serif" font-size="16"
        font-weight="650" fill="#111A28">① 自回归串行采样（现有 LLM）</text>
  <text x="62" y="170" font-family="Aptos, Segoe UI, Noto Sans SC, sans-serif" font-size="13" fill="#64748C">
    Sequential autoregressive sampling
  </text>
  <g font-family="Consolas, monospace" font-size="12.5" fill="#4A5A72">
    <rect x="62" y="192" width="46" height="34" rx="7" fill="#F5F7F4" stroke="#CFD7E2"/>
    <text x="76" y="214">t₁</text>
    <rect x="122" y="192" width="46" height="34" rx="7" fill="#F5F7F4" stroke="#CFD7E2"/>
    <text x="136" y="214">t₂</text>
    <rect x="182" y="192" width="46" height="34" rx="7" fill="#F5F7F4" stroke="#CFD7E2"/>
    <text x="196" y="214">t₃</text>
    <rect x="242" y="192" width="46" height="34" rx="7" fill="#F5F7F4" stroke="#CFD7E2"/>
    <text x="256" y="214">t₄</text>
    <rect x="302" y="192" width="46" height="34" rx="7" fill="#F5F7F4" stroke="#CFD7E2"/>
    <text x="316" y="214">…</text>
    <rect x="362" y="192" width="46" height="34" rx="7" fill="#F5F7F4" stroke="#CFD7E2"/>
    <text x="376" y="214">tₙ</text>
  </g>
  <line x1="110" y1="209" x2="120" y2="209" stroke="#64748C" marker-end="url(#ar3)"/>
  <line x1="170" y1="209" x2="180" y2="209" stroke="#64748C" marker-end="url(#ar3)"/>
  <line x1="230" y1="209" x2="240" y2="209" stroke="#64748C" marker-end="url(#ar3)"/>
  <line x1="290" y1="209" x2="300" y2="209" stroke="#64748C" marker-end="url(#ar3)"/>
  <line x1="350" y1="209" x2="360" y2="209" stroke="#64748C" marker-end="url(#ar3)"/>
  <text x="62" y="264" font-family="Aptos, Segoe UI, Noto Sans SC, sans-serif" font-size="13.5" fill="#4A5A72">
    每个 token 都要等上一个 token 出来，时间与费用随长度线性累加
  </text>
  <text x="62" y="296" font-family="Aptos, Segoe UI, Noto Sans SC, sans-serif" font-size="13.5" fill="#4A5A72">端到端</text>
  <text x="118" y="296" font-family="Aptos, Segoe UI, Noto Sans SC, sans-serif" font-size="13.5" font-weight="650" fill="#8A2A1E">3 – 329 秒</text>
  <text x="62" y="322" font-family="Aptos, Segoe UI, Noto Sans SC, sans-serif" font-size="13.5" fill="#4A5A72">输入</text>
  <text x="118" y="322" font-family="Aptos, Segoe UI, Noto Sans SC, sans-serif" font-size="13.5" font-weight="650" fill="#8A2A1E">$0.20 – 10 / MTok</text>
  <text x="62" y="346" font-family="Aptos, Segoe UI, Noto Sans SC, sans-serif" font-size="13.5" fill="#4A5A72">输出</text>
  <text x="118" y="346" font-family="Aptos, Segoe UI, Noto Sans SC, sans-serif" font-size="13.5" font-weight="650" fill="#8A2A1E">约为输入价的 5 倍</text>

  <!-- 右：并行 -->
  <rect x="624" y="112" width="536" height="252" rx="14" fill="#F7FDFB" stroke="#0E9F87" stroke-width="1.6"/>
  <text x="646" y="146" font-family="Aptos Display, Segoe UI, Noto Sans SC, sans-serif" font-size="16"
        font-weight="650" fill="#0A5A4C">② 并行采样（Jev）</text>
  <text x="646" y="170" font-family="Aptos, Segoe UI, Noto Sans SC, sans-serif" font-size="13" fill="#0A6E5E">
    All outputs produced in a single query
  </text>
  <rect x="646" y="192" width="330" height="34" rx="7" fill="#E3F5F1" stroke="#0E9F87"/>
  <text x="662" y="214" font-family="Consolas, monospace" font-size="12.5" fill="#0A5A4C">
    one query → "claim", 0.93 | "bill", 0.12 | …
  </text>
  <text x="646" y="264" font-family="Aptos, Segoe UI, Noto Sans SC, sans-serif" font-size="13.5" fill="#0A5A4C">
    所有输出一次性产生，不做逐 token 的条件依赖
  </text>
  <text x="646" y="296" font-family="Aptos, Segoe UI, Noto Sans SC, sans-serif" font-size="13.5" fill="#4A5A72">端到端</text>
  <text x="702" y="296" font-family="Aptos, Segoe UI, Noto Sans SC, sans-serif" font-size="13.5" font-weight="650" fill="#0A5A4C">70 – 500 ms</text>
  <text x="646" y="322" font-family="Aptos, Segoe UI, Noto Sans SC, sans-serif" font-size="13.5" fill="#4A5A72">输入</text>
  <text x="702" y="322" font-family="Aptos, Segoe UI, Noto Sans SC, sans-serif" font-size="13.5" font-weight="650" fill="#0A5A4C">$0.042 / MTok</text>
  <text x="646" y="346" font-family="Aptos, Segoe UI, Noto Sans SC, sans-serif" font-size="13.5" fill="#4A5A72">输出</text>
  <text x="702" y="346" font-family="Aptos, Segoe UI, Noto Sans SC, sans-serif" font-size="13.5" font-weight="650" fill="#0A5A4C">不计费</text>

  <rect x="40" y="392" width="1120" height="46" rx="11" fill="#F5F7F4" stroke="#E4E8EE"/>
  <text x="62" y="420" font-family="Aptos, Segoe UI, Noto Sans SC, sans-serif" font-size="13.5" fill="#4A5A72">
    代价：放弃自由文本生成。收益：延迟、成本、类型安全三件事同时改善 —— 官方口径为同类决策任务快 40×–200×。
  </text>
  <text x="40" y="462" font-family="Aptos, Segoe UI, Noto Sans SC, sans-serif" font-size="12.5" fill="#64748C">
    来源：TypeSafe AI（2026-09-15，官网首页同日数据）。本图为自绘示意，非等比时间轴。
  </text>
</svg>
